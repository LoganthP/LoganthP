name: Update jet heatmap SVG

on:
  schedule:
    # Runs once a day at 05:30 UTC. Adjust as you like.
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTPUT_PATH: github-jet.svg
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py --input data/contributions.json --output github-jet.svg

      - name: Commit and push if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update jet heatmap SVG"
          file_pattern: "github-jet.svg data/contributions.json"
