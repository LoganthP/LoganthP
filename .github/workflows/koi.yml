
name: Git Profile Koi

on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate Koi
        uses: yalongwastaken/git-koi@v1
        with:
          login: LoganthP
          body: asagi
          output-dir: koi

      - name: Commit animated koi
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "koi: update animated fish"
          git push
