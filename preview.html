<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoganthP Profile Preview</title>
  <style>
    body {
      margin: 0;
      background: #050816;
      color: #d7f9ff;
      font-family: Consolas, Menlo, monospace;
    }

    main {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px;
      text-align: center;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    h3 {
      font-size: 16px;
      font-weight: 400;
      color: #d7f9ff;
    }
  </style>
</head>
<body>
  <main>
    <h3><code>loganthp@github ~ $ ./contributions.sh</code></h3>
    <img src="./loganthp-heatmap.svg" width="860" alt="LoganthP contribution heatmap">
    <h3><code>loganthp@github ~ $ whoami</code></h3>
    <img src="./loganth-chromatic.svg" width="860" alt="Animated LOGANTH name banner">
    <br><br>
    <img src="./loganthp-ascii.svg" width="860" alt="Animated ASCII portrait">
    <h3><code>loganthp@github ~ $ info</code></h3>
    <img src="./loganthp-info-card.svg" width="490" alt="Loganth info card">
  </main>
</body>
</html>
